services:
  - type: web
    name: dankcharts-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
